# Pubblicazione su GitHub Pages: parte solo dopo una CI verde su master.
# Prerequisito (una volta): Settings → Pages → Source: "GitHub Actions".
# Finché Pages non è attivo il workflow termina senza errore, con un avviso.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Pages attivo?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages non è attivo: Settings → Pages → Source: GitHub Actions, poi riesegui questo workflow."
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.pages.outputs.enabled == 'true'
        run: npm ci
      - name: Build nella sottocartella del repository
        if: steps.pages.outputs.enabled == 'true'
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # solo valori pubblici (URL e publishable key, protetta da RLS); vuoti = modalità locale nel browser
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_FORECAST_URL: ${{ vars.VITE_FORECAST_URL }}
        run: npm run build -w @mdt/web
      - name: Nessuna chiave segreta nel bundle
        if: steps.pages.outputs.enabled == 'true'
        run: node scripts/check-bundle-secrets.mjs apps/web/dist
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: apps/web/dist

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
